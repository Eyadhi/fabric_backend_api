spring.application.name=fabric
spring.datasource.url=jdbc:postgresql://localhost:5432/fabric_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
server.error.include-stacktrace=never

# JWT configuration (local)
# Set a strong secret in production or via environment variables
jwt.secret=sasrdgtfhyhtrfdwetryhgfsdsdafsgdh
# Expiration in milliseconds (24 hours default)
jwt.expiration=86400000

# File storage configuration
app.file.storage.path=./storage

