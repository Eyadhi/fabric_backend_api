# Production configuration
server.port=${PORT:8080}

# Database configuration (Render / Supabase)
# Prefer setting a JDBC URL in SPRING_DATASOURCE_URL. Example:
# jdbc:postgresql://db.gparrnsafhbpefpwrjuv.supabase.co:5432/postgres?sslmode=require
# If your platform provides DATABASE_URL in the non-JDBC form (postgres://...), set
# SPRING_DATASOURCE_URL explicitly in Render to the JDBC URL above, or set
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
# Optional explicit username/password (use these if DATABASE_URL is not usable)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT configuration
jwt.secret=${JWT_SECRET:your-production-secret-key-change-this}
jwt.expiration=86400000

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://your-frontend-domain.vercel.app}

# Logging
logging.level.com.example.fabric=INFO
logging.level.org.springframework.security=WARN